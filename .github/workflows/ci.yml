name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest --cov=locus --cov-report=term-missing
      - name: CLI smoke test
        run: |
          locus demo --out /tmp/locus-demo --dashboard /tmp/locus-demo/dashboard.html
          test -s /tmp/locus-demo/location_index.csv
          test -s /tmp/locus-demo/dashboard.html
