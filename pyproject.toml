[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locus"
version = "0.1.0"
description = "Locus — investment attractiveness index for urban locations (H3 + PostGIS + dbt + Dagster)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Locus" }]
keywords = ["geospatial", "h3", "postgis", "dbt", "dagster", "urban-analytics"]
dependencies = [
  "h3>=4.1,<5",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
db = [
  "psycopg[binary]>=3.1,<4",
  "dbt-postgres>=1.10,<2",
]
orchestration = [
  "dagster>=1.9,<2",
  "dagster-webserver>=1.9,<2",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]
all = [
  "psycopg[binary]>=3.1,<4",
  "dbt-postgres>=1.10,<2",
  "dagster>=1.9,<2",
  "dagster-webserver>=1.9,<2",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
locus = "locus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
locus = ["defaults/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["locus"]
omit = ["*/tests/*"]
