services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: locus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: locus
      POSTGRES_PASSWORD: locus
      POSTGRES_DB: locus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locus -d locus"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb

volumes:
  pgdata:
